<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7F77DD">
<title>就活管理</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="就活管理">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f7f7f9;--bg3:#f0f0f5;
  --text:#1a1a1a;--text2:#666;--text3:#999;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);
  --purple:#7F77DD;--purple-light:#EEEDFE;--purple-dark:#3C3489;
  --teal-light:#E1F5EE;--teal-dark:#085041;--teal:#1D9E75;
  --coral-light:#FAECE7;--coral-dark:#712B13;--coral:#D85A30;
  --blue-light:#E6F1FB;--blue-dark:#0C447C;
  --green-light:#EAF3DE;--green-dark:#27500A;
  --red-light:#FCEBEB;--red-dark:#791F1F;--red:#E24B4A;
  --amber-light:#FAEEDA;--amber-dark:#633806;--amber:#EF9F27;
  --radius:8px;--radius-lg:12px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;
    --text:#f5f5f5;--text2:#aaa;--text3:#666;
    --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2);
    --purple-light:#2a2850;--purple-dark:#AFA9EC;
    --teal-light:#0a2a1e;--teal-dark:#9FE1CB;
    --coral-light:#2a160d;--coral-dark:#F0997B;
    --blue-light:#0d2237;--blue-dark:#85B7EB;
    --green-light:#142709;--green-dark:#C0DD97;
    --red-light:#2a0e0e;--red-dark:#F09595;
    --amber-light:#2a1a05;--amber-dark:#FAC775;
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);min-height:100vh}
.app-shell{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 20px;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.app-title{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.save-ind{font-size:12px;color:var(--text3)}
.btn-add{background:var(--purple);color:#fff;border:none;border-radius:var(--radius);padding:8px 16px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
.btn-add:hover{opacity:.88}
.btn-notif{border:0.5px solid var(--border2);background:none;border-radius:var(--radius);padding:7px 12px;font-size:13px;cursor:pointer;color:var(--text2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.btn-notif:hover{background:var(--bg2);color:var(--text)}
.btn-notif.granted{color:var(--teal);border-color:var(--teal)}
.btn-notif.denied{color:var(--red);border-color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--bg);border-radius:var(--radius);padding:12px 16px;text-align:center;border:0.5px solid var(--border)}
.stat-n{font-size:22px;font-weight:600}
.stat-l{font-size:11px;color:var(--text2);margin-top:2px}
.urgency-bar{margin-bottom:14px}
.urgency-title{font-size:13px;font-weight:500;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.urgency-cards{display:flex;flex-direction:column;gap:6px}
.urgency-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--radius);border:0.5px solid var(--border)}
.urgency-item.today{background:var(--red-light);border-color:rgba(226,75,74,.3)}
.urgency-item.one{background:var(--amber-light);border-color:rgba(239,159,39,.3)}
.urgency-item.three{background:var(--blue-light);border-color:rgba(55,138,221,.25)}
.urgency-item.week{background:var(--bg2);border-color:var(--border)}
.urgency-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.urgency-item.today .urgency-dot{background:var(--red)}
.urgency-item.one .urgency-dot{background:var(--amber)}
.urgency-item.three .urgency-dot{background:var(--purple)}
.urgency-item.week .urgency-dot{background:var(--text3)}
.urgency-days{font-size:12px;font-weight:600;min-width:48px;color:var(--text2)}
.urgency-item.today .urgency-days{color:var(--red)}
.urgency-item.one .urgency-days{color:var(--amber-dark,#854F0B)}
.urgency-item.three .urgency-days{color:var(--purple)}
.urgency-company{font-size:13px;font-weight:500;flex:1}
.urgency-label{font-size:12px;color:var(--text2)}
.main-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.main-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
.panel{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:16px}
.panel-title{font-size:15px;font-weight:500;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-nav{display:flex;gap:4px}
.cal-nav button{background:none;border:0.5px solid var(--border);border-radius:var(--radius);width:30px;height:30px;cursor:pointer;font-size:16px;color:var(--text);display:flex;align-items:center;justify-content:center}
.cal-nav button:hover{background:var(--bg2)}
.cal-month{font-size:14px;font-weight:500}
.legend{display:flex;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot.es{background:var(--purple)}.dot.int{background:var(--teal)}.dot.other{background:var(--coral)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{text-align:center;font-size:11px;color:var(--text2);padding:4px 0}
.cal-day{min-height:46px;padding:4px;border-radius:4px;cursor:pointer;border:1px solid transparent}
.cal-day:hover{background:var(--bg2)}
.cal-day.today{background:var(--blue-light);border-color:rgba(55,138,221,.3)}
.cal-day.selected{outline:2px solid var(--purple);outline-offset:-1px}
.cal-day.other-month .dn{color:var(--text3)}
.cal-day.urgent-today{background:rgba(226,75,74,.12)!important;border-color:rgba(226,75,74,.4)!important}
.cal-day.urgent-one{background:rgba(239,159,39,.1)!important;border-color:rgba(239,159,39,.35)!important}
.cal-day.urgent-three{background:rgba(127,119,221,.08)!important;border-color:rgba(127,119,221,.25)!important}
.dn{font-size:11px;font-weight:500;margin-bottom:3px}
.dot-wrap{display:flex;flex-wrap:wrap;gap:2px}
.company-list{display:flex;flex-direction:column;gap:8px;max-height:520px;overflow-y:auto;padding-right:2px}
.company-card{border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.company-card:hover{border-color:var(--border2)}
.company-name{font-size:14px;font-weight:500}
.company-url{font-size:12px;color:#3478f6;margin-top:4px;cursor:pointer;word-break:break-all}
.company-url:hover{text-decoration:underline}
.deadlines{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.dl-badge{font-size:11px;padding:2px 7px;border-radius:10px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.dl-es{background:var(--purple-light);color:var(--purple-dark)}
.dl-int{background:var(--teal-light);color:var(--teal-dark)}
.dl-other{background:var(--coral-light);color:var(--coral-dark)}
.dl-del{cursor:pointer;opacity:.55;font-weight:700}
.dl-del:hover{opacity:1;color:var(--red)}
.btn-del-dl{background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;line-height:1;padding:0 4px}
.btn-del-dl:hover{color:var(--red)}
.status-badge{font-size:11px;padding:2px 7px;border-radius:10px;font-weight:500}
.st-applying{background:var(--blue-light);color:var(--blue-dark)}
.st-es{background:var(--purple-light);color:var(--purple-dark)}
.st-interview{background:var(--teal-light);color:var(--teal-dark)}
.st-offer{background:var(--green-light);color:var(--green-dark)}
.st-ng{background:var(--red-light);color:var(--red-dark)}
.card-actions{display:flex;gap:6px;margin-top:8px}
.btn-edit{flex:1;background:none;border:0.5px solid var(--border);border-radius:var(--radius);padding:5px;font-size:12px;cursor:pointer;color:var(--text2)}
.btn-edit:hover{background:var(--bg2);color:var(--text)}
.btn-del{background:none;border:0.5px solid var(--border);border-radius:var(--radius);padding:5px 10px;font-size:12px;cursor:pointer;color:var(--red)}
.btn-add-small{width:100%;border:0.5px dashed var(--border2);background:none;border-radius:var(--radius);padding:8px;font-size:13px;color:var(--text2);cursor:pointer;margin-top:4px}
.btn-add-small:hover{background:var(--bg2);color:var(--text)}
.empty{text-align:center;color:var(--text3);font-size:13px;padding:24px 0}
.detail-box{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-top:12px}
.detail-box h4{font-size:14px;font-weight:500;margin-bottom:8px}
.dl-row-display{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--border)}
.dl-row-display:last-child{border-bottom:none}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--bg);border-radius:var(--radius-lg);border:0.5px solid var(--border);padding:20px;width:380px;max-height:90vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:600;margin-bottom:16px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:500}
.form-group input,.form-group select,.form-group textarea{width:100%;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:8px 10px;font-size:14px;color:var(--text);outline:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--purple)}
.form-group textarea{height:70px;resize:vertical}
.dl-input-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.dl-input-row select,.dl-input-row input[type=date]{flex:1;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:6px 8px;font-size:13px;color:var(--text)}
.dl-input-row input[type=text]{width:90px;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:6px 8px;font-size:13px;color:var(--text)}
.dl-input-row .btn-remove{background:none;border:none;cursor:pointer;color:var(--text3);font-size:20px;line-height:1;padding:0 4px}
.modal-footer{display:flex;gap:8px;margin-top:16px}
.modal-footer button{flex:1;padding:10px;border-radius:var(--radius);font-size:14px;cursor:pointer;font-weight:500}
.btn-save{background:var(--purple);color:#fff;border:none}
.btn-save:hover{opacity:.88}
.btn-cancel-modal{background:none;border:0.5px solid var(--border2);color:var(--text)}
.btn-cancel-modal:hover{background:var(--bg2)}
.install-bar{background:var(--purple-light);border:0.5px solid rgba(127,119,221,.3);border-radius:var(--radius-lg);padding:12px 16px;margin-bottom:14px;display:none;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.install-bar.show{display:flex}
.install-bar span{font-size:13px;color:var(--purple-dark)}
.install-bar button{background:var(--purple);color:#fff;border:none;border-radius:var(--radius);padding:7px 14px;font-size:13px;cursor:pointer;font-weight:500;white-space:nowrap}
.install-bar .dismiss{background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;padding:0}
/* --- 連携版で追加 --- */
[hidden]{display:none!important}
.dl-input-row input[type=time]{width:92px;flex-shrink:0;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:6px 6px;font-size:13px;color:var(--text)}
.dl-input-row{flex-wrap:wrap}
.btn-link{border:0.5px solid var(--border2);background:none;border-radius:var(--radius);padding:7px 12px;font-size:13px;color:var(--text2);display:flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn-link:hover{background:var(--bg2);color:var(--text)}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login-card{width:100%;max-width:360px;background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:24px;display:flex;flex-direction:column;gap:12px}
.login-card h1{font-size:20px}
.login-card p{font-size:13px;color:var(--text2);line-height:1.6}
.login-card input{width:100%;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 12px;font-size:16px;color:var(--text)}
.login-card .err{color:var(--red);font-size:13px}
.footer-links{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:18px;font-size:12px}
.footer-links button{background:none;border:none;color:var(--text2);cursor:pointer;text-decoration:underline;font-size:12px}
.sync-note{font-size:11px;color:var(--text3);margin-top:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;z-index:2000;max-width:calc(100vw - 32px)}
@media(max-width:420px){.modal{width:calc(100vw - 24px)}}
</style>
</head>
<body>
<div id="loading" class="login-wrap" style="color:var(--text3)">読み込み中…</div>

<div id="login" class="login-wrap" hidden>
  <form class="login-card" id="loginForm">
    <h1>就活管理</h1>
    <p>スケジュールアプリと同じメールアドレス・パスワードでログインしてください。</p>
    <input type="email" id="loginEmail" placeholder="メールアドレス" autocomplete="username" required>
    <input type="password" id="loginPw" placeholder="パスワード" autocomplete="current-password" required>
    <div class="err" id="loginErr" hidden></div>
    <button type="submit" class="btn-add" style="justify-content:center;padding:10px">ログイン</button>
  </form>
</div>

<div class="app-shell" id="app" hidden>
  <header>
    <span class="app-title">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
      就活管理
    </span>
    <div class="header-right">
      <span class="save-ind" id="save-ind">読み込み中…</span>
      <a class="btn-link" href="../" title="スケジュールアプリを開く">📅 スケジュール</a>
      <button class="btn-add" onclick="openAdd()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        企業を追加
      </button>
    </div>
  </header>

  <div class="stats" id="stats"></div>
  <div id="urgency-section"></div>

  <div class="main-grid">
    <div>
      <div class="panel">
        <div class="cal-header">
          <div class="cal-month" id="cal-month"></div>
          <div class="cal-nav">
            <button onclick="changeMonth(-1)" aria-label="前の月">‹</button>
            <button onclick="changeMonth(1)" aria-label="次の月">›</button>
          </div>
        </div>
        <div class="legend">
          <span class="legend-item"><span class="dot es"></span>ES</span>
          <span class="legend-item"><span class="dot int"></span>面接</span>
          <span class="legend-item"><span class="dot other"></span>その他</span>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
      <div id="day-detail"></div>
    </div>
    <div class="panel" style="display:flex;flex-direction:column">
      <div class="panel-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        企業一覧
      </div>
      <div class="company-list" id="company-list"></div>
    </div>
  </div>

  <div class="footer-links">
    <button onclick="exportData()">データを書き出す</button>
    <button onclick="document.getElementById('importFile').click()">以前のデータを読み込む</button>
    <button onclick="logout()">ログアウト</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</div>

<div class="modal-bg" id="modal-bg" onclick="handleModalBgClick(event)">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="shukatsu.js"></script>
</body>
</html>
